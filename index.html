<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARC Scout">
<title>ARC Scout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#05070b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone survey for scouts, laptop pages for coaches. ARC colors: white, blue, black. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#e7ebf2; --line:#d2d9e4;
  --fg:#0a0e16; --muted:#566275; --accent:#1d5fd6; --accent-ink:#ffffff; --accent-soft:#e1eafb;
  --good:#1f8a4c; --good-soft:#dcf0e3; --bad:#c43535; --bad-soft:#f8dfdf; --info:#0f8aa8;
  --head:#05070b; --head-fg:#ffffff; --red:#cc3333; --blue:#1d5fd6; --flag:#e8590c;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --bg:#07090d; --surface:#10141c; --sunk:#181e29; --line:#262f3f;
  --fg:#f2f5fa; --muted:#93a0b5; --accent:#3d82f7; --accent-ink:#ffffff; --accent-soft:#132643;
  --good:#4cc47c; --good-soft:#12301f; --bad:#ef6a6a; --bad-soft:#3a1717; --info:#38bfdc;
  --head:#000000; --head-fg:#ffffff; --red:#e25454; --blue:#3d82f7; --flag:#ff8a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07090d; --surface:#10141c; --sunk:#181e29; --line:#262f3f;
  --fg:#f2f5fa; --muted:#93a0b5; --accent:#3d82f7; --accent-ink:#ffffff; --accent-soft:#132643;
  --good:#4cc47c; --good-soft:#12301f; --bad:#ef6a6a; --bad-soft:#3a1717; --info:#38bfdc;
  --head:#000000; --head-fg:#ffffff; --red:#e25454; --blue:#3d82f7; --flag:#ff8a3d; color-scheme:dark}
/* Pastel: soft lavender, light header */
:root[data-theme="pastel"]{
  --bg:#faf7fd; --surface:#ffffff; --sunk:#f0ebf8; --line:#e2daef;
  --fg:#37324a; --muted:#756e8a; --accent:#9cb7f4; --accent-ink:#1f2340; --accent-soft:#e8eefc;
  --good:#3f9468; --good-soft:#e0f3e8; --bad:#c95f69; --bad-soft:#fbe5e7; --info:#5f9fc4;
  --head:#ebe2f7; --head-fg:#37324a; --red:#e28585; --blue:#82a6ea; --flag:#e09a50; color-scheme:light}
/* Colorblind-friendly (Okabe–Ito colors): no red/green pairs; up = blue, down = vermillion */
:root[data-theme="cb"]{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#e9ecf1; --line:#d3d8e0;
  --fg:#0b0d12; --muted:#535b69; --accent:#0072b2; --accent-ink:#ffffff; --accent-soft:#dbeaf5;
  --good:#0072b2; --good-soft:#d9e9f5; --bad:#d55e00; --bad-soft:#fbe5d6; --info:#56b4e9;
  --head:#0b0d12; --head-fg:#ffffff; --red:#d55e00; --blue:#0072b2; --flag:#cc79a7; color-scheme:light}
/* Inverted colors: the light theme turned negative; photos and field maps are turned back so they look normal */
:root[data-theme="inverted"]{color-scheme:light;filter:invert(1) hue-rotate(180deg);background:#fff}
:root[data-theme="inverted"] img,:root[data-theme="inverted"] canvas[data-paint],:root[data-theme="inverted"] .mapcv,:root[data-theme="inverted"] .simcv,:root[data-theme="inverted"] svg image{filter:invert(1) hue-rotate(180deg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.6rem} h3{font-size:1.2rem;text-transform:uppercase;letter-spacing:.06em}
.num,td.n,output{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto;width:100%}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-fg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.45rem;font-weight:700}
.hex{width:30px;height:34px;background:var(--accent);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:var(--accent-ink);font-size:.8rem;letter-spacing:.02em}
.who{font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctx{font-size:.8rem;opacity:.75}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--sunk);color:var(--fg)}
.pill.admin,.pill.superadmin{background:var(--accent);color:var(--accent-ink)}
.pill.pending{background:var(--accent-soft);color:var(--fg)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;font-family:var(--f-mono);margin-left:2px}
.badge:empty{display:none}
.seg{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:10px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:7px;font-weight:600;color:var(--muted);min-width:0;font-size:.95rem}
@media (max-width:420px){.seg button{font-size:.85rem}}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rolepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.rolepick button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.rolepick button b{font-family:var(--f-display);font-size:1.25rem}
.rolepick button span{font-size:.8rem;color:var(--muted)}
.rolepick button.on{border-color:var(--accent);background:var(--accent-soft)}
.pill.disabled{background:var(--bad-soft);color:var(--bad)}
.link{background:none;border:0;color:inherit;text-decoration:underline;padding:4px}
.demo{background:var(--accent-soft);color:var(--fg);font-size:.85rem}
.demo .wrap{padding-block:6px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);border-radius:8px;min-width:0}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--fg);background:var(--accent-soft)}
main{padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
@media (min-width:820px){
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px;padding-block:6px}
  .tabs button{flex:0 0 auto;flex-direction:row;font-size:.95rem;padding:8px 14px;gap:8px}
  main{padding-bottom:40px}
}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.bar>*{min-width:0}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.muted{color:var(--muted)} .small{font-size:.85rem}
div.f{display:flex;flex-direction:column;gap:4px}
div.f>span:first-child{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pick:not([open]){padding-block:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);flex:1 1 140px}
label.f input,label.f select,label.f textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:1rem;color:var(--fg)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)} .btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.big{width:100%;padding:16px;font-size:1.2rem;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.btn:disabled{opacity:.5;cursor:default}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:6px}

/* scout form */
.sec-head{display:flex;align-items:center;gap:10px}
.sec-head h3{flex:0 0 auto}
.sec-head::after{content:"";flex:1;height:2px;background:var(--line)}
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fld .lbl{font-weight:600;flex:1 1 140px}
.fld .pts{font-size:.75rem;color:var(--muted);font-weight:500;margin-left:6px}
.counter{display:flex;align-items:center;gap:6px}
.counter button{width:56px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:1.6rem;font-weight:600;line-height:1}
.counter button.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.counter output{min-width:46px;text-align:center;font-size:1.5rem}
.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:14px 16px;font-weight:600;text-align:left}
.toggle>span:last-child{font-family:var(--f-display);font-size:1.1rem;padding:2px 12px;border-radius:99px;background:var(--surface)}
.toggle.on{background:var(--good-soft);border-color:var(--good)} .toggle.on>span:last-child{background:var(--good);color:#fff}
.choices{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.choices button{flex:1 1 auto;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:12px 14px;font-weight:600}
.choices button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stack{display:flex;flex-direction:column;gap:8px;width:100%}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{background:var(--sunk);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none} th.sort.on{color:var(--fg)}
td.n,th.n{text-align:right}
td.wrapcell{white-space:normal;min-width:180px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
.bar-cell{display:grid;grid-template-columns:72px 3.2em;align-items:center;gap:8px;justify-content:end}
.bar-cell .track{display:block;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar-cell i{display:block;height:100%;border-radius:4px;background:var(--accent);min-width:2px}
.bar-cell .num{text-align:right}
.trendcell{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;white-space:nowrap}
.trendcell svg{width:64px;height:20px;overflow:visible}
.trendcell .tdelta{min-width:4.6em;text-align:right;font:600 .8rem var(--f-mono)}
.tdelta.up{color:var(--good)} .tdelta.down{color:var(--bad)} .tdelta.flat{color:var(--muted)}
.yes{color:var(--good);font-weight:600} .no{color:var(--muted)}

/* builder */
.frow{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:1fr;gap:10px;background:var(--bg)}
@media (min-width:640px){.frow{grid-template-columns:2fr 1fr 1fr 90px}}
.frow .tools{display:flex;gap:6px;justify-content:flex-end;grid-column:1/-1}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.switch input{width:auto}
.slist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:1.4rem;font-weight:500}
.stat span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chartbox{position:relative;height:280px}
.note{border-left:3px solid var(--accent);padding:4px 10px;background:var(--bg);border-radius:0 6px 6px 0}
.note small{display:block;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin:0 4px 4px 0}
.mapq{display:flex;flex-direction:column;gap:8px;width:100%}
.maptools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.maptools button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.9rem}
.maptools button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.maptools .sw{width:36px;height:36px;padding:0;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.maptools .sw.on{box-shadow:0 0 0 3px var(--fg)}
.maptools .grow{flex:1}
.mapcv{width:100%;max-width:560px;border-radius:8px;touch-action:none;display:block;background:#3b4250;cursor:crosshair}
.mapthumb{width:84px;height:auto;border-radius:4px;display:block;background:#3b4250}
.overlays{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.overlays figure{margin:0;display:flex;flex-direction:column;gap:6px}
.overlays canvas{width:100%;border-radius:8px;background:#3b4250}
.overlays figcaption{font-size:.85rem;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-word}
textarea.formula-in{font-family:var(--f-mono);font-size:.95rem;min-height:70px}
.ops{display:flex;gap:6px;flex-wrap:wrap}.ops .btn{min-width:46px;font-family:var(--f-mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .small{flex-basis:100%;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
.chip{border:1px solid var(--line);background:var(--accent-soft);border-radius:99px;padding:6px 12px;font-weight:600;font-size:.88rem}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.slots{grid-template-columns:1fr 1fr}}
.slot.red input{border-left:5px solid var(--red)} .slot.blue input{border-left:5px solid var(--blue)}
.slot.red{color:var(--red)} .slot.blue{color:var(--blue)}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.board .side{border-radius:var(--r);padding:14px 8px;display:flex;flex-direction:column;gap:2px;color:#fff;min-width:0}
.board .red{background:var(--red)} .board .blue{background:var(--blue)}
.board span{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.9}
.board b{font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.05;font-weight:500}
.board small{opacity:.9} .board em{font-style:normal;font-family:var(--f-mono);font-size:.85rem;overflow-wrap:anywhere}
.board .vs{font-family:var(--f-display);font-size:1.3rem;color:var(--muted)}
.odds{display:flex;height:30px;border-radius:8px;overflow:hidden;font-weight:700;font-size:.85rem;color:#fff}
.odds .r{background:var(--red);display:flex;align-items:center;padding-left:10px;min-width:44px}
.odds .b{background:var(--blue);flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;min-width:44px}
.pill.redp{background:var(--red);color:#fff} .pill.bluep{background:var(--blue);color:#fff}
/* Coach pages: laptop layout. Survey: phone column. */
main.narrow{max-width:680px}
.card>label.f,.stack>label.f,.card>.f{flex:0 0 auto}
.desk .wrap{max-width:1480px}
.desk .top{position:relative;top:0}
.desk main.narrow{max-width:680px}
.desk .tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:flex-start;gap:4px;padding:6px max(16px,calc((100vw - 1480px)/2 + 16px));}
.desk .tabs button{flex:1 1 auto;justify-content:center;flex-direction:row;font-size:.95rem;padding:8px 14px;gap:8px;white-space:nowrap}
.desk .tabs{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.desk .tabs::-webkit-scrollbar{display:none}
@media (max-width:1240px){.desk .tabs button{padding:8px 10px;font-size:.9rem;gap:6px}}
@media (max-width:1040px){.desk .tabs button svg{display:none}.desk .tabs button{padding:8px 9px}}
@media (max-width:1100px){.poolchip span{display:none}.poolchip b{max-width:200px}}
.desk main{padding-bottom:48px}
.desk .chartbox{height:380px}
.desk table{font-size:.88rem}
.anahead{display:flex;flex-direction:column;gap:12px}
.split{display:flex;flex-direction:column;gap:16px}
.split>*{min-width:0}
@media (min-width:980px){
  .desk .anahead{display:grid;grid-template-columns:minmax(540px,auto) 1fr;align-items:center}
  .desk .split{display:grid;grid-template-columns:minmax(300px,360px) 1fr;align-items:start}
  .desk .split.wide-l{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .desk .split.teams{grid-template-columns:minmax(0,1fr) minmax(420px,.9fr)}
  .desk .split>.sticky{position:sticky;top:70px}
  .desk .slots{grid-template-columns:1fr 1fr}
}
.lgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.lchart{margin:0;padding:14px 14px 10px;gap:6px}
.lchart h4,.card h4{margin:0;font-family:var(--f-display);font-size:1.2rem;font-weight:700;line-height:1.15}
.eyebrow{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
svg.series{width:100%;height:auto;display:block;overflow:visible}
svg.series .ax{font:500 10px var(--f-mono);fill:var(--muted)}
.trend{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;font-family:var(--f-mono)}
.trend.up{background:var(--good-soft);color:var(--good)} .trend.down{background:var(--bad-soft);color:var(--bad)} .trend.flat{background:var(--sunk);color:var(--muted)}
.moverlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mover{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.mover.up{border-left:4px solid var(--good)} .mover.down{border-left:4px solid var(--bad)}
.mover b{font-size:1rem} .mover .num{font-size:1.05rem}
.mapstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mapstrip figure{margin:0;flex:0 0 130px;display:flex;flex-direction:column;gap:4px}
.mapstrip canvas{width:130px;border-radius:6px;background:#3b4250}

function scoreOf(r, survey) {
  if (!survey) return typeof r.score === "number" ? r.score : null;
  let s = 0;
  for (const f of survey.fields) {
    const v = r.answers?.[f.id];
    if (isFoul(f)) continue;  // foul points go to the other alliance

    else if (f.type === "toggle") s += v ? (+f.points || 0) : 0;
    else if (f.type === "choice") s += +(f.options.find(o => o.label === v)?.points) || 0;

  const txt = "arcscout:" + pin;
  try { const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }

}

  const err = e => toast(errMsg(e), true);
  const a = S.api;
  S.subs.push(a.watchSettings(v => {
    S.settings = v;
    if ((v.eventId || "") !== S.rosterFor) {
      S.rosterFor = v.eventId || ""; S.rosterUnsub?.(); S.roster = [];
      S.rosterUnsub = v.eventId ? a.watchEvent(v.eventId, e => { S.roster = (e?.teams || []).map(String); refresh("roster"); }, () => {}) : null;
    }
    applyPool(); updatePoolChip(); refresh("settings");
  }, err));
  S.subs.push(() => { S.rosterUnsub?.(); S.rosterUnsub = null; S.rosterFor = null; S.roster = []; });
  S.subs.push(a.watchSurveys(v => { S.surveys = v.sort((x, y) => (x.name || "").localeCompare(y.name || "")); applyPool(); refresh("surveys"); }, err));
  S.subs.push(a.watchMine(S.user.uid, v => { S.mine = v.sort((x, y) => y.t - x.t); refresh("mine"); }, err));
  S.subs.push(a.watchSchedules(v => { S.schedules = v; refresh("schedules"); }, err));
  if (isStaffReal()) {
    S.subs.push(a.watchEvents(v => { S.events = v; applyPool(); updatePoolChip(); refresh("events"); }, err));
    S.subs.push(a.watchResponses(v => { S.allResponses = v.sort((x, y) => y.t - x.t); applyPool(); updatePoolChip(); refresh("responses"); }, err));
    S.subs.push(a.watchFlags(v => { S.flags = v || {}; applyPool(); refresh("flags"); }, err));
    S.subs.push(a.watchVariables(v => { S.vars = v.sort((x, y) => (x.name || "").localeCompare(y.name || "")); refresh("vars"); }, err));
    S.subs.push(a.watchUsers(v => { S.users = v.sort((x, y) => (x.name || "").localeCompare(y.name || "")); refresh("users"); }, err));
  }
  S.subs.push(a.watchFieldMap(v => setFieldImage(v), err));
  S.subs.push(a.watchTeams(v => { S.teams = Object.fromEntries(v.map(t => [t.id, t])); refresh("teams"); }, err));
}
function refresh(what) {
  if (!$("#main")) return;
  if (what === "users") { const bd = $("#pendBadge"); if (bd) bd.textContent = pendingCount() || ""; }
  if (what === "settings") { const c = $("#ctx"); if (c) c.textContent = ctxLine(); }
  const v = S.view;
  // don't wipe a form someone is typing in
  if (v === "scout" && what !== "surveys" && what !== "settings") { renderMine(); teamHint(); return; }
  if (v === "builder" && S.editing) return;
  if (v === "analyze" && S.varEdit && S.ana.tab === "variables") return;
  const ae = document.activeElement;
  if (ae && $("#main").contains(ae) && (ae.tagName === "TEXTAREA" || (ae.tagName === "INPUT" && ae.type !== "checkbox"))) return; // someone is typing
  renderView();
}
const pendingCount = () => S.users.filter(u => u.role === "pending").length;
const ctxLine = () => [S.settings.season, S.settings.event].filter(Boolean).join(" · ") || "No event set";

      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("That file isn't an image we can read.")); i.src = url; });
      const scale = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let data = c.toDataURL("image/jpeg", .82);
      if (data.length > 750000) data = c.toDataURL("image/jpeg", .6);
      await S.api.saveFieldMap({image: data, w: c.width, h: c.height});

  });

async function saveEditing() {
  const e = S.editing;
  if (!e.name.trim()) return toast("Give the survey a name.", true);
  if (!e.fields.length) return toast("Add at least one question.", true);
  for (const f of e.fields) {
    if (!f.label.trim()) return toast("Every question needs a label.", true);
    f.points = +f.points || 0;
    if (f.type === "choice") {
      f.options = (f.optText || "").split(",").map(s => s.trim()).filter(Boolean).map(s => { const [l, p] = s.split(":"); return {label: l.trim(), points: +p || 0}; });
      if (f.options.length < 2) return toast(`"${f.label}" needs at least two choices.`, true);
    } else f.options = [];
    if (f.type === "counter") f.foul = isFoul(f); else delete f.foul;
    if (f.type === "map") { f.role = roleOf(f); f.mode = f.mode === "draw" ? "draw" : "spot"; f.spots = Math.min(12, Math.max(1, Math.round(+f.spots || 1))); f.points = 0; }
    else { delete f.mode; delete f.spots; delete f.role; }
  }
  const out = clone(e); out.fields.forEach(f => delete f.optText); out.name = out.name.trim();
  try { await S.api.saveSurvey(out); S.editing = null; toast("Survey saved"); renderView(); } catch (er) { toast(errMsg(er), true); }
}

function csvFor() {
  const sv = surveyById(S.raw.survey); if (!sv) return "";
  const rows = S.responses.filter(r => r.surveyId === sv.id && (!S.raw.event || r.event === S.raw.event) && (!S.raw.team || r.team === S.raw.team));
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = ["Time", "Season", "Event", "Scout", "Team", "Match", "Alliance", "Score", ...sv.fields.map(f => `${f.section}: ${f.label}`)];
  const body = rows.map(r => [new Date(r.t).toISOString(), r.season, r.event, r.scoutName, r.team, r.match, r.alliance || "", scoreOf(r, sv),
    ...sv.fields.map(f => { const v = r.answers?.[f.id]; return f.type === "toggle" ? (v ? "Yes" : "No") : f.type === "map" ? (v ? JSON.stringify(v) : "") : v; })]);
  return [head, ...body].map(r => r.map(q).join(",")).join("\n");
}

function teamStats(rows, sv) {
  const by = {};

/* ---------- map question roles + shooting traffic ---------- */
const ROLES = {start: "Starting position", cycle: "Cycle paths", shoot: "Shooting positions", end: "End position", other: "Other"};
function roleOf(f) {
  if (ROLES[f.role]) return f.role;
  if (f.mode === "draw") return "cycle";
  if (/shoot|shot/i.test(f.label)) return "shoot";
  if (/start|begin|initial/i.test(f.label)) return "start";
  if (/end|park|final|finish/i.test(f.label)) return "end";
  return "other";
}
function spotsGrid(matches, gw, gh, norm = "max") {
  // matches: [[{x,y}...]] — each match counts once per cell; norm "max" for display, "sum" for comparing shapes
  const g = new Float32Array(gw * gh);
  for (const spots of matches) {
    const seen = new Uint8Array(gw * gh);
    for (const s of spots) { const cx = Math.round(s.x * (gw - 1)), cy = Math.round(s.y * (gh - 1));
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { if (dx * dx + dy * dy > 5) continue; const x = cx + dx, y = cy + dy; if (x < 0 || y < 0 || x >= gw || y >= gh) continue; const k = y * gw + x; if (!seen[k]) { seen[k] = 1; g[k] += 1; } } }
  }
  boxBlur(g, gw, gh, 3); boxBlur(g, gw, gh, 2);
  let d = 0; if (norm === "sum") { for (const v of g) d += v; } else { for (const v of g) if (v > d) d = v; }
  if (d) for (let i = 0; i < g.length; i++) g[i] /= d;
  return g;
}
const clamp01 = v => Math.max(0, Math.min(1, v));
// The field is the same when turned around, so a blue match is rotated 180° to show it from the red side (and vice versa).
const needTurn = (r, side) => !!(r.alliance && side && r.alliance[0] !== side);
function normSpots(r, ms, side, mirror) { const t = needTurn(r, side); return (ms || []).map(m => { let x = t ? 1 - m.x : m.x; const y = t ? 1 - m.y : m.y; if (mirror) x = 1 - x; return {x, y}; }); }
function normPath(r, p, side, mirror) { const t = needTurn(r, side); return (p || []).map((v, i) => { let w = t ? 1 - v : v; if (mirror && i % 2 === 0) w = 1 - w; return +w.toFixed(3); }); }
function shootSpots(rows, sv, flip, side) {
  const fs = sv.fields.filter(f => f.type === "map" && roleOf(f) === "shoot");
  return rows.map(r => fs.flatMap(f => normSpots(r, r.answers?.[f.id]?.m, side, flip))).filter(a => a.length);
}
function overlapPct(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += Math.min(a[i], b[i]); return s; }
function percentileOf(v, list) { if (v == null || !list.length) return null; const lt = list.filter(x => x < v).length, eq = list.filter(x => x === v).length; return (lt + eq / 2) / list.length * 100; }
function congestion(sv, picked, by, recent, ctx) {
  const c = S.sim.cong, ms = metricsFor(sv);
  if (!ms.find(m => m.id === c.metric)) c.metric = (ms.find(m => /accura/i.test(m.label)) || ms.find(m => /skill/i.test(m.label)) || ms.find(m => m.id === "score") || ms[0])?.id || "";
  const met = ms.find(m => m.id === c.metric);
  const vals = Object.values(by).map(rs => ctx.teamVal(c.metric, rs)).filter(v => v != null);
  const hasShoot = sv.fields.some(f => f.type === "map" && roleOf(f) === "shoot");
  const gw = 48, gh = Math.max(12, Math.round(48 / S.fieldAspect));
  const res = {met, hasShoot, alliances: []};
  for (const side of ["r", "b"]) {
    const ts = picked.filter(p => p && p.k[0] === side);
    const al = {side, ts, overlap: null, why: ""};
    for (const p of ts) {
      const rs = recent(by[p.t] || []);
      p.skillVal = rs.length ? ctx.teamVal(c.metric, rs) : null; p.skill = percentileOf(p.skillVal, vals);
      const sp = shootSpots(rs, sv, S.sim.flip?.[p.k], p.k[0]); p.shots = sp.reduce((a, m) => a + m.length, 0);
      p.dist = p.shots >= 2 ? spotsGrid(sp, gw, gh, "sum") : null; p.pen = 0;

    else if (ts.some(p => !p.dist)) al.why = `Not enough shooting data for ${ts.filter(p => !p.dist).map(p => p.t).join(" and ")}.`;
    else {

      const ovX = clamp01((al.overlap - c.thr) / (100 - c.thr));
      for (const p of ts) { const skD = p.skill == null ? .5 : clamp01((c.skill - p.skill) / c.skill); p.pen = p.affected * c.max / 100 * ovX * skD; p.ovX = ovX; p.skD = skD; }

}

      <div class="bar">

        <label class="f">Penalty starts above overlap (%)<input id="congThr" type="number" min="0" max="95" step="5" value="${c.thr}"></label>
        <label class="f">Skilled shooters are at or above (percentile)<input id="congSkill" type="number" min="5" max="100" step="5" value="${c.skill}"></label>

const ordinal = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

/* ============================================================
   SIMULATOR FIELD MAPS — heat blobs of each robot's cycles,
   start/end spots, and overlap (likely collision) zones
   ============================================================ */
const ROBOT_COL = {r1: "#ff3b3b", r2: "#ffa093", b1: "#3b7bff", b2: "#93c8ff"};

async function fileToCanvas(file, max, filter = "") {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("That file isn't a photo we can open.")); i.src = url; });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    const x = c.getContext("2d"); if (filter) x.filter = filter; x.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}

const loadScript = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("load")); document.head.appendChild(s); });
function parseTeamList(text) {
  // finds one team number per line (plus whatever name follows it); fixes common misreads like O→0 and l→1
  const out = new Map();
  for (const raw of String(text).replace(/,/g, "\n").split(/\n/)) {
    const line = raw.replace(/[|_—–=]+/g, " ").replace(/\b[0-9OoIlSB]{2,5}\b/g, w => /\d/.test(w) ? w.replace(/[Oo]/g, "0").replace(/[Il]/g, "1").replace(/S/g, "5").replace(/B/g, "8") : w).trim();
    const m = line.match(/(?:^|[^\d.])(\d{1,5})(?![\d.])/); if (!m) continue;
    const num = String(+m[1]); if (!+num || out.has(num)) continue;
    const name = line.slice(line.indexOf(m[1]) + m[1].length).replace(/[^A-Za-z0-9 &'.\-]/g, " ").replace(/\b(yes|no|ok|pass|done|x|v)\b/gi, " ").replace(/\s+/g, " ").replace(/\s+[A-Za-z]$/, "").trim().slice(0, 40);
    if (num.length < 2) continue;
    out.set(num, {num, name, on: !/^20[1-3]\d$/.test(num)});
  }
  return [...out.values()].sort((a, b) => +a.num - +b.num);
}
async function readBoard(file) {
  S.ocr = {status: "reading", progress: 0, items: [], preview: ""};
  keepScroll(renderView);
  try {
    const prev = await fileToCanvas(file, 900); S.ocr.preview = prev.toDataURL("image/jpeg", .7);
    const c = await fileToCanvas(file, 2200, "grayscale(1) contrast(1.35)");
    if (!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
    const worker = await Tesseract.createWorker("eng", 1, {logger: m => { if (m.status === "recognizing text") { S.ocr.progress = m.progress; const el = $("#ocrProg"); if (el) el.style.width = Math.round(m.progress * 100) + "%"; } }});
    await worker.setParameters({tessedit_pageseg_mode: "4"});  // read it as rows of a list
    const {data} = await worker.recognize(c); await worker.terminate();
    const items = parseTeamList(data.text);
    S.ocr = {status: items.length ? "done" : "empty", items, preview: S.ocr.preview};
  } catch (er) {
    S.ocr = {status: "error", items: [], preview: S.ocr.preview, err: er.message?.startsWith("That file") ? er.message : ""};
  }

}

const XFER_FORMAT = "arc-scout-event";
async function saveFile(name, text, type = "application/json") {

    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({filename: name, data: new Blob([text], {type})}); return true; }
  } catch (e) { if (e?.code === "declined") return false; }

  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();

  return true;
}

    variables: S.vars.filter(v => svIds.includes(v.surveyId)).map(v => ({id: v.id, surveyId: v.surveyId, name: v.name, expr: v.expr, combine: v.combine, decimals: v.decimals})),

    responses: rs.map(r => ({id: r.id, eventId: r.evId, event: r.event, surveyId: r.surveyId, surveyName: r.surveyName || "", season: r.season || "", team: r.team, match: r.match, alliance: r.alliance || "", scoutName: r.scoutName || "", t: r.t, answers: r.answers || {}, ...(r.training ? {training: true} : {})}))

async function runImport() {
  const im = S.imp, d = im.data, uid = S.user.uid, me = S.me?.name || "";
  try {
    im.step = "surveys";
    // 1) surveys: use the matching survey that's already here. Questions are matched by section + wording + type,
    //    so a file made on another site (different question ids) still lands in your survey. Otherwise add it as a closed survey.
    const svMap = {}, fMap = {}, newSurveys = [];
    const qk = f => [f.section || "", String(f.label || "").trim().toLowerCase(), f.type].join("|");
    for (const sv of d.surveys || []) {
      let here = surveyById(sv.id), map = null;
      if (!here) {
        let best = null;
        for (const x of S.surveys) {
          const byKey = Object.fromEntries(x.fields.map(f => [qk(f), f.id]));
          const m = {}; let hit = 0; for (const f of sv.fields) if (byKey[qk(f)]) { m[f.id] = byKey[qk(f)]; hit++; }
          const sc = hit / Math.max(1, sv.fields.length) + (x.active ? .01 : 0);
          if (hit / Math.max(1, sv.fields.length) >= .6 && (!best || sc > best.sc)) best = {x, m, sc};
        }
        if (best) { here = best.x; map = best.m; }
      } else map = Object.fromEntries(sv.fields.map(f => [f.id, f.id]));
      if (here) { svMap[sv.id] = here.id; fMap[sv.id] = map; }
      else { const id = await S.api.saveSurvey({name: `${sv.name} (imported)`, active: false, fields: sv.fields}); svMap[sv.id] = id; fMap[sv.id] = null; newSurveys.push(sv.id); }
    }
    im.step = "variables";
    for (const v of d.variables || []) {
      const to = svMap[v.surveyId]; if (!to) continue;
      const map = fMap[v.surveyId];
      if (S.vars.some(x => x.surveyId === to && x.name === v.name)) continue;
      let ok = true;
      const expr = map ? String(v.expr).replace(/\{(\w+:)?([^}]+)\}/g, (all, sc, id) => { if (id === "score") return all; if (!map[id]) { ok = false; return all; } return `{${sc || ""}${map[id]}}`; }) : v.expr;
      if (ok) await S.api.saveVariable({surveyId: to, name: v.name, expr, combine: v.combine || "avg", decimals: v.decimals ?? 2});
    }
    // 2) events
    im.step = "events";
    const evMap = {};
    for (const p of im.plan) {
      if (p.target !== "new") {
        const here = S.events.find(e => e.id === p.target) || {id: await ensureSavedEvent(p.target), teams: []};
        evMap[p.src.id] = here.id;
        await S.api.saveEvent({id: here.id, teams: [...new Set([...(here.teams || []), ...(p.src.teams || [])])]});
      } else {
        let name = p.src.name; if (eventList().some(e => e.name.toLowerCase() === name.toLowerCase())) name += " (imported)";
        evMap[p.src.id] = await S.api.saveEvent({name, type: p.src.type || "Other", date: p.src.date || "", aliases: [], teams: p.src.teams || []});
      }
    }
    // 3) team names and photos fill in only what's missing here
    im.step = "teams";
    for (const [t, x] of Object.entries(d.teams || {})) {
      const cur = S.teams[t] || {}, upd = {};
      for (const k of ["name", "from", "notes", "photo"]) if (x[k] && !cur[k]) upd[k] = x[k];
      if (Object.keys(upd).length) await S.api.saveTeam(t, upd);
    }
    // 4) matches, skipping ones already here
    im.step = "matches";
    const sig = r => [r.team, String(r.match), r.scoutName || "", r.t].join("|");
    const have = {}; for (const r of S.allResponses) (have[r.evId] ||= new Set()).add(sig(r));
    const rows = [], names = Object.fromEntries(eventList().map(e => [e.id, e.name]));
    let skipped = 0;
    for (const r of d.responses) {
      const ev = evMap[r.eventId], svId = svMap[r.surveyId]; if (!ev || !svId) { skipped++; continue; }
      if (have[ev]?.has(sig(r))) { skipped++; continue; }
      (have[ev] ||= new Set()).add(sig(r));
      const sv = surveyById(svId) || d.surveys.find(x => x.id === r.surveyId), map = fMap[r.surveyId];
      const answers = map ? Object.fromEntries(Object.entries(r.answers || {}).filter(([k]) => map[k]).map(([k, v]) => [map[k], v])) : (r.answers || {});
      const row = {surveyId: svId, surveyName: sv?.name || r.surveyName || "", season: r.season || d.season || "", event: names[ev] || im.plan.find(p => evMap[p.src.id] === ev)?.src.name || "", eventId: ev,
        alliance: r.alliance || "", uid, scoutName: r.scoutName || "Imported", team: String(r.team), match: String(r.match), answers, t: r.t || Date.now(), imported: true, importedBy: me, ...(r.training ? {training: true} : {})};
      row.score = scoreOf(row, sv?.fields ? sv : null); rows.push(row);
    }

    S.pool.ids = [...new Set([...poolIds(), ...Object.values(evMap)])]; savePool(); applyPool(); updatePoolChip();
    const svName = [...new Set(Object.values(svMap))].map(id => surveyById(id)?.name).filter(Boolean).join(", ") || "the imported survey";
    for (const k of ["raw", "ana", "look"]) if (S[k]) S[k].survey = Object.values(svMap)[0] || S[k].survey;
    S.imp = {done: {n: rows.length, skipped, events: im.plan.map(p => p.target === "new" ? p.src.name : eventList().find(e => e.id === p.target)?.name || p.src.name), survey: svName}};
    keepScroll(renderView);
  } catch (er) {
    console.error("Import failed at", im.step, er);
    const c = er?.code || er?.message || "";

      ? `The database refused the import (while saving ${im.step}). Usually that means the security rules aren't published yet: Firebase → Firestore Database → Rules, paste firestore.rules, Publish. Then try again. Already-imported matches are skipped.`

    keepScroll(renderView);
  }
}

/* ============================================================
   SCHEDULE — which scouts watch which robot in each match.
   Coaches and head scouts build a draft, check it, then publish it.
   Scouts only ever see the published version.

const SLOT_NAMES = ["Red 1", "Red 2", "Blue 1", "Blue 2", "Extra 1", "Extra 2"];
const SCHED_DEF = {matches: 30, per: 4, maxOn: 4, minOn: 2, minOff: 2, maxOff: 6};
const schedId = () => (collectingId() || "none").replace(/[\/\s]/g, "_");
const schedDraftKey = () => "arcscout-sched-draft-" + schedId();
const publishedSched = () => S.schedules.find(x => x.id === schedId()) || null;
const firstName = n => { const p = String(n || "").trim().split(/\s+/); return p.length > 1 ? p[0] + " " + p[1][0] + "." : p[0] || "?"; };
const schedPeople = () => S.users.filter(u => ["student", "head", "admin", "superadmin"].includes(u.role)).sort((a, b) => ((a.role === "student" ? 0 : a.role === "head" ? 1 : 2) - (b.role === "student" ? 0 : b.role === "head" ? 1 : 2)) || (a.name || "").localeCompare(b.name || ""));

function generateSchedule(o, seed) {
  let sd = seed || 1; const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const ids = [...o.scouts], n = ids.length, k = Math.min(o.per, n), N = o.matches;
  const st = Object.fromEntries(ids.map(u => [u, {on: false, run: 0, total: 0, started: false, slot: -1}]));
  const grid = [];
  for (let m = 0; m < N; m++) {
    const fair = (m + 1) * k / Math.max(1, n);
    const score = u => {
      const s = st[u], behind = fair - s.total;
      if (s.on) {
        if (s.run < o.minOn) return 1e4;
        if (s.run >= o.maxOn) return -1e4 + behind;
        return 60 + behind * 12 + rnd();
      }
      if (s.started && s.run < o.minOff) return -5e3 + behind;
      if (s.started && o.maxOff && s.run >= o.maxOff) return 5e3 + s.run;
      return 40 + behind * 12 + Math.min(s.run, 10) + rnd() * 3;
    };
    const pick = ids.map(u => [u, score(u)]).sort((a, b) => b[1] - a[1]).slice(0, k).map(x => x[0]);
    const row = Array(o.per).fill(""), set = new Set(pick);
    pick.filter(u => st[u].on && st[u].slot >= 0 && st[u].slot < o.per).forEach(u => { if (!row[st[u].slot]) row[st[u].slot] = u; else set.add(u); });
    pick.filter(u => !row.includes(u)).forEach(u => { const i = row.indexOf(""); if (i >= 0) row[i] = u; });
    for (const u of ids) {
      const s = st[u], now = row.includes(u);
      if (now === s.on) s.run++; else { s.on = now; s.run = 1; }
      if (now) { s.total++; s.started = true; s.slot = row.indexOf(u); }
    }
    grid.push(row);
  }
  return grid;
}

// Check a schedule against the rules. Breaks only count between two shifts.
function checkSchedule(d) {
  const o = d.rules, grid = d.grid, bad = new Set(), people = {}, issues = [];
  grid.forEach((row, m) => {

  });

  if (grid.some(r => new Set(r.filter(Boolean)).size < r.filter(Boolean).length)) issues.push("someone is in two spots in the same match");
  for (const u of d.scouts) {
    const on = grid.map(r => r.includes(u)), runs = [];
    on.forEach((v, m) => { if (!runs.length || runs.at(-1).on !== v) runs.push({on: v, start: m, len: 1}); else runs.at(-1).len++; });
    const shifts = runs.filter(r => r.on), breaks = runs.filter((r, i) => !r.on && i > 0 && i < runs.length - 1);
    const p = {total: on.filter(Boolean).length, longest: Math.max(0, ...shifts.map(r => r.len)), shortestBreak: breaks.length ? Math.min(...breaks.map(r => r.len)) : null, longestBreak: breaks.length ? Math.max(...breaks.map(r => r.len)) : null, warn: []};
    const mark = r => { for (let m = r.start; m < r.start + r.len; m++) grid[m].forEach((x, i) => { if (x === u) bad.add(m + ":" + i); }); };
    shifts.forEach(r => { if (r.len > o.maxOn) { p.warn.push(`${r.len} in a row (max ${o.maxOn})`); mark(r); } else if (r.len < o.minOn && r.start + r.len < grid.length && r.start > 0) { p.warn.push(`only ${r.len} in a row (min ${o.minOn})`); mark(r); } });
    breaks.forEach(r => { if (r.len < o.minOff) p.warn.push(`${r.len}-match break (min ${o.minOff})`); else if (o.maxOff && r.len > o.maxOff) p.warn.push(`${r.len}-match break (max ${o.maxOff})`); });
    people[u] = p;
  }
  const warned = Object.values(people).filter(p => p.warn.length).length;
  if (warned) issues.push(`${warned} scout${warned > 1 ? "s" : ""} break${warned > 1 ? "" : "s"} a rule`);
  return {bad, people, issues};
}

    try { await S.api.saveSchedule({id: d.id, eventId: S.settings.eventId || "", event: S.settings.event || "", rules: d.rules, slots: d.slots, grid: d.grid, scouts: d.scouts, names, byName: S.me.name || ""}); toast("Published. Scouts can see it now."); } catch (er) { toast(errMsg(er), true); }
  }
  if (a === "schUnpub") { armedClick(b, "schunpub", async () => { try { await S.api.deleteSchedule(d.id); toast("Unpublished. Scouts no longer see a schedule."); } catch (er) { toast(errMsg(er), true); } }); return; }
  saveDraft(); keepScroll(renderView);
}
document.addEventListener("change", e => {
  const t = e.target, d = S.sched?.draft;
  if (t.matches?.("[data-schas]")) { S.sched.as = t.value; keepScroll(renderView); return; }
  if (t.matches?.("[data-schonly]")) { (S.sched ||= {}).only = t.checked; keepScroll(renderView); return; }
  if (t.matches?.("[data-viewas]")) { setViewAs(t.value); return; }
  if (!d) return;
  if (t.matches?.("[data-sr]")) { const v = t.value === "" ? (t.dataset.sr === "maxOff" ? 0 : SCHED_DEF[t.dataset.sr]) : Math.max(+t.min || 0, Math.round(+t.value)); d.rules[t.dataset.sr] = v; store.set("arcscout-sched-rules", d.rules);
    if (d.grid && (t.dataset.sr === "matches" || t.dataset.sr === "per")) { d.slots = SLOT_NAMES.slice(0, d.rules.per); d.grid = generateSchedule({...d.rules, scouts: d.scouts}, d.seed || 1); }
    saveDraft(); keepScroll(renderView); }
  else if (t.matches?.("[data-schscout]")) { const u = t.dataset.schscout; d.scouts = t.checked ? [...new Set([...d.scouts, u])] : d.scouts.filter(x => x !== u); saveDraft(); keepScroll(renderView); }
  else if (t.matches?.("[data-schcell]")) { const [mi, i] = t.dataset.schcell.split(":").map(Number); d.grid[mi][i] = t.value; saveDraft(); keepScroll(renderView); }
});

/* ============================================================
   USERS (admin)
   ============================================================ */
function viewUsers(m) {
  const pend = S.users.filter(u => u.role === "pending").sort((x, y) => (x.createdAt?.toMillis?.() ?? x.createdAt ?? 0) - (y.createdAt?.toMillis?.() ?? y.createdAt ?? 0));
  const rest = S.users.filter(u => u.role !== "pending");
  const canEdit = u => u.uid !== S.user.uid && u.role !== "superadmin" && (u.role !== "admin" || isSuper());
  const order = {superadmin: 0, admin: 1, head: 2, student: 3, disabled: 4};
  rest.sort((x, y) => (order[x.role] - order[y.role]) || (x.name || "").localeCompare(y.name || ""));
  m.innerHTML = `
  <h2>Users</h2>
  <section class="card">
    <div class="spread"><h3>Waiting for approval</h3><span class="pill ${pend.length ? "pending" : ""}">${pend.length}</span></div>
    ${pend.length ? `<div class="stack">${pend.map(u => `
      <div class="frow" style="grid-template-columns:1fr">
        <div class="spread"><div><b>${esc(u.name)}</b> <span class="num small muted">${esc(u.username)}</span><div class="small muted">Asked to join as a <b>${ROLE_WORD[u.requested] || "scout"}</b>${u.createdAt ? " · " + when(u.createdAt?.toMillis?.() ?? u.createdAt) : ""}</div></div></div>
        <div class="bar">
          ${[["student", "scout"], ["head", "head scout"], ["admin", "coach"]].map(([r, l]) => `<button class="btn sm ${(u.requested || "student") === r ? "primary" : ""}" data-act="approve" data-id="${esc(u.uid)}" data-role="${r}">Approve as ${l}</button>`).join("")}
          <button class="btn sm danger" data-act="deny" data-id="${esc(u.uid)}">Decline</button>
        </div>
      </div>`).join("")}</div>` : `<p class="muted">No one is waiting. New sign-ups show up here, and the Users tab gets a red count.</p>`}
    <p class="small muted">Only coaches can approve scouts, head scouts and coaches. ${isSuper() ? "As super admin, you're the only one who can change or turn off a coach's account." : "Only the super admin can change or turn off a coach's account."}</p>
  </section>
  <div class="tw"><table><thead><tr><th>Name</th><th>Username</th><th class="n">Matches</th><th>Role</th><th>Approved by</th></tr></thead><tbody>
  ${rest.map(u => `<tr><td>${esc(u.name)}</td><td class="num">${esc(u.username)}</td><td class="n num">${S.allResponses.filter(r => r.uid === u.uid).length}</td>
    <td>${canEdit(u) ? `<select data-role="${esc(u.uid)}" aria-label="Role for ${esc(u.name)}">${["student", "head", "admin", "disabled"].map(r => `<option value="${r}" ${u.role === r ? "selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}</select>`
      : `<span class="pill ${esc(u.role)}">${ROLE_LABEL[u.role] || esc(u.role)}${u.uid === S.user.uid ? " (you)" : ""}</span>`}</td>
    <td class="small muted">${esc(S.users.find(x => x.uid === u.approvedBy)?.name || "")}</td></tr>`).join("")}
  </tbody></table></div>
  <section class="card"><h3>Add someone directly</h3>
    <p class="small muted">Skips the approval step. Handy for setting up a whole roster at once.</p>
    <form id="newUser" class="bar" autocomplete="off">
      <label class="f">Name<input id="nuName" required placeholder="First name, last initial"></label>
      <label class="f">Username<input id="nuUser" required autocapitalize="none" placeholder="e.g. maya.r"></label>
      <label class="f">Password<input id="nuPw" required minlength="6" placeholder="6+ characters"></label>
      <label class="f">Role<select id="nuRole"><option value="student">Scout</option><option value="head">Head scout</option><option value="admin">Coach</option></select></label>
      <button class="btn primary">Create account</button>
    </form>
  </section>
  <p class="small muted">Forgot password? Turn the old account off and have them sign up again. ${S.api.demo ? "" : "You can also reset it in the Firebase console under Authentication."}</p>`;
  $("#newUser").addEventListener("submit", async e => {
    e.preventDefault();
    const u = cleanUser($("#nuUser").value);
    if (!validUser(u)) return toast("Usernames use 3–30 letters, numbers, dots, dashes or underscores.", true);
    try { await S.api.createUser(u, $("#nuPw").value, $("#nuName").value.trim(), $("#nuRole").value); toast(`Created ${u}. Share the username and password with them.`); e.target.reset(); }
    catch (er) { toast(errMsg(er), true); }
  });
  m.querySelectorAll("select[data-role]").forEach(s => s.addEventListener("change", async () => {
    try { await S.api.setRole(s.dataset.role, s.value); toast("Role updated"); } catch (er) { toast(errMsg(er), true); }
  }));
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("change", e => {
  if (e.target.matches?.("[data-scenario-pick]")) { setPractice(e.target.value); return; }
  if (e.target.matches?.("[data-pastel]")) {
    const v = pastelPick(); v[+e.target.dataset.pastel] = e.target.value; store.set("arcscout-pastel", v); applyTheme(); refreshThemeBtns();
    if ($("#main")) keepScroll(renderView);
    return;
  }
  if (e.target.matches?.("[data-theme-pick]")) {
    const v = e.target.value; v === "system" ? store.set("arcscout-theme", null) : store.set("arcscout-theme", v); applyTheme();
    if (v === "pastel") S.pastelOpen = true;
    refreshThemeBtns();
    if ($("#main")) keepScroll(renderView); else redrawMaps();
    return;
  }
  const ph = e.target.closest?.("input[data-photo]");
  if (ph) { const f = ph.files[0]; if (f) saveRobotPhoto(ph.dataset.photo, f); ph.value = ""; return; }
  const t = e.target.closest("[data-flt]"); if (!t) return;
  const st = S[t.dataset.flt]; st[t.dataset.k] = t.value;
  if (t.dataset.k === "survey") { st.event = ""; if (t.dataset.flt === "ana") st.team = null; }
  renderView();
});
document.addEventListener("click", async e => {
  const pt = e.target.closest("[data-pt]");
  if (pt) { const k = pt.dataset.pt + "|" + pt.dataset.k; S.lk.excl[k] ? delete S.lk.excl[k] : S.lk.excl[k] = 1; saveLk(); keepScroll(renderView); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case "practiceOn": setPractice(b.dataset.s || "season"); break;
    case "briefToggle": store.set(briefKey(), !briefOpen()); renderShell(); break;
    case "practiceOff": if (studentMode()) break; setPractice(false); break;
    case "studentOnAsk": S.stuAsk = S.stuAsk === "on" ? null : "on"; renderShell(); setTimeout(() => $(".stupanel [name=pin]")?.focus(), 0); break;
    case "studentOffAsk": S.stuAsk = S.stuAsk === "off" ? null : "off"; renderShell(); setTimeout(() => $(".stupanel [name=pin]")?.focus(), 0); break;
    case "studentCancel": S.stuAsk = null; renderShell(); break;
    case "practiceReset": armedClick(b, "preset", () => { S.api.reset(); location.reload(); }); break;
    case "logout": if (studentMode()) break; if (S.api.practice) { setPractice(false); break; } stopSubs(); S.form = null; S.editing = null; S.signingUp = false; await S.api.signOut(); break;
    case "clearField": try { await S.api.saveFieldMap(null); toast("Back to the built-in BIOBUZZ field"); } catch (er) { toast(errMsg(er), true); } break;
    case "loginMode": renderLogin(b.dataset.m); break;
    case "approve": {
      const u = S.users.find(x => x.uid === id);
      try { await S.api.approve(id, b.dataset.role, S.user.uid); toast(`Approved ${u?.name || "user"} as a ${ROLE_WORD[b.dataset.role] || "scout"}`); } catch (er) { toast(errMsg(er), true); }
      break;
    }
    case "deny": armedClick(b, "dn" + id, async () => { try { await S.api.setRole(id, "disabled"); toast("Request declined"); } catch (er) { toast(errMsg(er), true); } }); break;
    case "useNext": case "schAll": case "schNone": case "schGen": case "schShuffle": case "schPublish": case "schUnpub": schedAction(a, b); break;
    case "nav": S.view = b.dataset.v; store.set("arcscout-view", S.view); renderShell(); window.scrollTo(0, 0); break;
    // scout form
    case "inc": case "dec": {
      const v = Math.max(0, (+S.form.answers[id] || 0) + (a === "inc" ? 1 : -1)); S.form.answers[id] = v;
      const o = $("#c-" + id); o.textContent = v; o.classList.add("bump"); setTimeout(() => o.classList.remove("bump"), 90);
      if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
      break;
    }
    case "tog": { const v = !S.form.answers[id]; S.form.answers[id] = v; b.classList.toggle("on", v); b.lastElementChild.textContent = v ? "Yes" : "No"; break; }
    case "pick": case "rate": {
      const v = a === "rate" ? +b.dataset.val : b.dataset.val;
      S.form.answers[id] = S.form.answers[id] === v ? (a === "rate" ? 0 : "") : v;
      b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b && S.form.answers[id] === v));
      break;
    }
    case "submit": submitForm(b); break;
    case "ally": S.form.alliance = b.dataset.v; b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); break;
    case "demoRestore": armedClick(b, "dr" + b.dataset.k, () => { if (S.api.restoreEarlier(b.dataset.k)) location.reload(); else toast("Couldn't read that save.", true); }); break;
    case "demoForget": armedClick(b, "df" + b.dataset.k, () => { S.api.forgetEarlier(b.dataset.k); keepScroll(renderView); }); break;
    case "demoReset": armedClick(b, "dreset", () => { S.api.reset(); location.reload(); }); break;
    case "expEv": exportEvents([b.dataset.id]); break;
    case "expAll": exportEvents(eventList().map(e => e.id)); break;
    case "impCancel": S.imp = null; keepScroll(renderView); break;
    case "impGo": b.disabled = true; b.textContent = "Importing…"; runImport(); break;
    case "rsAdd": case "ocrSave": case "ocrRow": case "ocrClose": case "rsRemove": case "rsClear": case "photoDel": rosterAction(a, b); break;
    case "evCreate": case "evCollect": case "evSave": case "evEdit": case "evEditCancel": case "evEditSave": case "evDel": case "poolOnly": case "poolAll": case "poolShared": dataAction(a, b); break;
    case "mrGo": S.mr.match = b.dataset.m; S.mr.typed = false; keepScroll(renderView); break;
    case "mrStep": { const nums = [...document.querySelectorAll(".mchip")].map(x => x.dataset.m), j = nums.indexOf(S.mr.match) + +b.dataset.d; if (nums[j]) { S.mr.match = nums[j]; S.mr.typed = false; keepScroll(renderView); } break; }
    case "toMatch": S.mr = {event: b.dataset.ev, match: String(+b.dataset.m || b.dataset.m), typed: true}; S.ana.survey = S.raw.survey; S.ana.tab = "match"; S.view = "analyze"; store.set("arcscout-view", S.view); renderShell(); window.scrollTo(0, 0); break;
    // builder
    case "saveSettings":
      try { await S.api.saveSettings({season: $("#dSeason").value.trim()}); toast("Season saved"); } catch (er) { toast(errMsg(er), true); }
      break;
    case "newSurvey": startEdit({name: "", active: false, fields: [{id: "f_" + rid(), section: "TeleOp", label: "", type: "counter", points: 0, options: []}]}); break;
    case "newTemplate": startEdit(biobuzzTemplate()); break;
    case "edit": startEdit(surveyById(id)); break;
    case "dup": { const c = clone(surveyById(id)); delete c.id; c.name += " (copy)"; c.active = false; startEdit(c); break; }
    case "toggleOpen": { const s = clone(surveyById(id)); s.active = !s.active; try { await S.api.saveSurvey(s); toast(s.active ? "Scouts can now use this survey" : "Survey closed"); } catch (er) { toast(errMsg(er), true); } break; }
    case "delSurvey": armedClick(b, "ds" + id, async () => { try { await S.api.deleteSurvey(id); toast("Survey deleted. Its matches stay in the team database."); } catch (er) { toast(errMsg(er), true); } }); break;
    case "cancelEdit": S.editing = null; renderView(); break;
    case "saveSurvey": saveEditing(); break;
    case "fAdd": S.editing.fields.push({id: "f_" + rid(), section: S.editing.fields.at(-1)?.section || "TeleOp", label: "", type: "counter", points: 0, options: [], optText: ""}); renderView(); break;
    case "fDel": S.editing.fields.splice(+b.dataset.i, 1); renderView(); break;
    case "fUp": case "fDown": { const i = +b.dataset.i, j = a === "fUp" ? i - 1 : i + 1, f = S.editing.fields; [f[i], f[j]] = [f[j], f[i]]; renderView(); break; }
    // raw
    case "delResp": armedClick(b, "dr" + id, async () => { try { await S.api.deleteResponse(id); toast("Response deleted"); } catch (er) { toast(errMsg(er), true); } }); break;
    case "csv": saveFile(`scouting-${slug(surveyById(S.raw.survey)?.name)}.csv`, csvFor(), "text/csv"); break;
    case "copyCsv": try { await navigator.clipboard.writeText(csvFor()); toast("CSV copied. Paste it into Google Sheets or Excel."); } catch { toast("Your browser blocked copying. Use Download CSV instead.", true); } break;
    // analyze
    case "anaTab": S.ana.tab = b.dataset.t; S.varEdit = null; renderView(); break;
    case "varNew": S.varEdit = {name: "", text: "", combine: "avg", decimals: 2}; renderView(); break;
    case "varEdit": { const v = S.vars.find(x => x.id === id), sv = surveyById(v.surveyId); S.varEdit = {id: v.id, name: v.name, text: exprToText(v.expr, sv), combine: v.combine, decimals: v.decimals ?? 2}; renderView(); break; }
    case "varScope": { const ta = $("#vExpr"); if (S.varEdit && ta) S.varEdit.text = ta.value; S.varScope = b.dataset.s; keepScroll(renderView); break; }
    case "varCancel": S.varEdit = null; renderView(); break;
    case "varClear": $("#vExpr").value = ""; $("#vExpr").dispatchEvent(new Event("input")); break;
    case "varSave": saveVar(surveyById(S.ana.survey)); break;
    case "varDel": {
      const v = S.vars.find(x => x.id === id), users = S.vars.filter(x => x.id !== id && x.expr.includes(`{${id}}`));
      if (users.length) { toast(`"${users[0].name}" uses this variable. Change that one first.`, true); break; }
      armedClick(b, "dv" + id, async () => { try { await S.api.deleteVariable(id); toast(`Deleted "${v.name}"`); } catch (er) { toast(errMsg(er), true); } }); break;
    }
    case "varGraph": S.graph.metric = id; S.graph.mode = "all"; S.ana.tab = "graphs"; renderView(); break;
    case "varExample": { const sv = surveyById(S.ana.survey);
      try { await S.api.saveVariable({surveyId: sv.id, name: "Tips per cycle", expr: `{${b.dataset.a}}/{${b.dataset.b}}`, combine: "total", decimals: 2}); toast('Added "Tips per cycle"'); } catch (er) { toast(errMsg(er), true); } break; }
    case "gMode": S.graph.mode = b.dataset.m; renderView(); break;
    case "toSim": S.ana.tab = "sim"; renderView(); window.scrollTo(0, 0); break;
    case "side": S.side = b.dataset.s; store.set("arcscout-side", S.side); keepScroll(renderView); break;
    case "simMapMode": S.sim.mapMode = b.dataset.m; keepScroll(renderView); break;
    case "flagSet": try { await S.api.setFlag(b.dataset.key, {status: b.dataset.s, by: S.me?.name || ""}); toast(b.dataset.s === "approved" ? "Flag approved. The match is marked ⚑ in Analyze." : "Flag dismissed"); } catch (er) { toast(errMsg(er), true); } break;
    case "flagUndo": try { await S.api.clearFlag(b.dataset.key); toast("Back to needs review"); } catch (er) { toast(errMsg(er), true); } break;
    case "flagView": S.flagView = b.dataset.v; keepScroll(renderView); break;
    case "gRestore": S.poolRows.forEach(r => delete S.lk.excl[r.id + "|" + b.dataset.k]); saveLk(); keepScroll(renderView); break;
    case "simOff": S.sim.off ||= {}; S.sim.off[b.dataset.k] = !S.sim.off[b.dataset.k]; keepScroll(renderView); break;
    case "simAllOn": S.sim.off = {}; keepScroll(renderView); break;
    case "simFlip": S.sim.flip[b.dataset.k] = !S.sim.flip[b.dataset.k]; keepScroll(renderView); break;
    case "simClear": S.sim.off = {}; S.match = {r1: "", r2: "", b1: "", b2: ""}; renderView(); break;
    case "sort": { const k = b.dataset.k; S.ana.sort = {k, d: S.ana.sort.k === k ? -S.ana.sort.d : -1}; renderView(); break; }
    case "anaTeam": S.ana.team = S.ana.team === b.dataset.team ? null : b.dataset.team; renderView(); if (S.ana.team) $("#anaDetail")?.scrollIntoView({behavior: "smooth"}); break;
    case "closeDetail": if (b.dataset.from === "tm") S.tm.team = null; else S.ana.team = null; renderView(); break;
    // teams
    case "lookTeam": S.look.team = b.dataset.team; S.look.event = ""; S.view = "lookup"; store.set("arcscout-view", S.view); renderShell(); window.scrollTo(0, 0); break;
    case "lookProfile": S.tm.team = S.look.team; S.view = "teams"; store.set("arcscout-view", S.view); renderShell(); window.scrollTo(0, 0); break;
    case "pastelOpen": S.pastelOpen = !S.pastelOpen; refreshThemeBtns(); break;
    case "pastelClose": S.pastelOpen = false; refreshThemeBtns(); break;
    case "pastelReset": store.set("arcscout-pastel", null); applyTheme(); refreshThemeBtns(); if ($("#main")) keepScroll(renderView); break;
    case "theme": {
      store.set("arcscout-theme", isDark() ? "light" : "dark"); applyTheme();
      refreshThemeBtns();
      if ($("#main")) keepScroll(renderView); else if (S.paintJobs) redrawMaps();
      break;
    }
    case "lkStep": { const sel = $("#lkTeam"); const i = sel.selectedIndex + +b.dataset.d; if (i >= 0 && i < sel.options.length) { S.look.team = sel.options[i].value; S.look.event = ""; keepScroll(renderView); } break; }
    case "lkHide": { const svId = S.look.survey, l = new Set(S.lk.hidden[svId] || []); l.add(b.dataset.k); S.lk.hidden[svId] = [...l]; saveLk(); keepScroll(renderView); break; }
    case "lkAll": S.lk.hidden[S.look.survey] = []; saveLk(); keepScroll(renderView); break;
    case "lkNone": S.lk.hidden[S.look.survey] = [...(S.look.keys || [])]; saveLk(); keepScroll(renderView); break;
    case "lkOnlyVars": S.lk.hidden[S.look.survey] = (S.look.keys || []).filter(k => !(S.look.varKeys || []).includes(k)); saveLk(); keepScroll(renderView); break;
    case "lkTrend": S.lk.trend[b.dataset.k] = !lkTrend(b.dataset.k); saveLk(); keepScroll(renderView); break;
    case "lkAvg": S.lk.avg[b.dataset.k] = !lkAvg(b.dataset.k); saveLk(); keepScroll(renderView); break;
    case "lkRestore": { const k = b.dataset.k; (S.look.ids || []).forEach(id => delete S.lk.excl[id + "|" + k]); saveLk(); keepScroll(renderView); break; }
    case "lkRestoreTeam": (S.look.ids || []).forEach(id => Object.keys(S.lk.excl).forEach(x => x.startsWith(id + "|") && delete S.lk.excl[x])); saveLk(); keepScroll(renderView); break;
    case "tmSort": { const k = b.dataset.k; S.tm.sort = {k, d: S.tm.sort.k === k ? -S.tm.sort.d : -1}; renderView(); break; }
    case "tmTeam": S.tm.team = S.tm.team === b.dataset.team ? null : b.dataset.team; renderView(); break;
    case "tmAdd": {
      const n = ($("#tmNew").value || "").replace(/\D/g, ""); if (!n) return toast("Type a team number.", true);
      try { await S.api.saveTeam(n, {name: S.teams[n]?.name || ""}); S.tm.team = n; renderView(); } catch (er) { toast(errMsg(er), true); }
      break;
    }
    case "tmSave": {
      const t = b.dataset.team;
      try { await S.api.saveTeam(t, {name: $("#tmName").value.trim(), from: $("#tmFrom").value.trim(), notes: $("#tmNotes").value}); toast(`Saved team ${t}`); } catch (er) { toast(errMsg(er), true); }
      break;
    }
  }
});
boot();
</script>
